<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root and members of the daemon to own the service -->
  <policy user="root">
    <allow own="org.tuf.ControlCenter"/>
    <allow send_destination="org.tuf.ControlCenter"/>
    <allow receive_sender="org.tuf.ControlCenter"/>
  </policy>

  <!-- Allow all logged in desktop users to communicate with the daemon -->
  <policy context="default">
    <allow send_destination="org.tuf.ControlCenter"/>
    <allow receive_sender="org.tuf.ControlCenter"/>
  </policy>
</busconfig>
